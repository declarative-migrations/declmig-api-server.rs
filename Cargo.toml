[package]
name = "declmig-api-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JSON API server for Declarative Migrations"
repository = "https://github.com/declarative-migrations/declmig-api-server.rs"

[features]
default = ["tcp-transport", "nats-transport"]
tcp-transport = []
nats-transport = []

[dependencies]
declmig-lib-core = { git = "https://github.com/declarative-migrations/declmig-lib-core.git", features = ["read-write"] }
ores-transport = { git = "https://github.com/ORESoftware/ores-transport.git", branch = "main" }  # TODO(DEN): pin to a rev once ores-transport is pushed
k8s-web-api-data-plane = { git = "https://github.com/ORESoftware/k8s-libs-and-shared-defs.git", rev = "55adadc9f6d223d40b28ae66097dfe16930951b1", package = "k8s-web-api-data-plane" }
flags2env = { version = "0.1.0", git = "https://github.com/flags-2-env/flags-2-env", rev = "d7bad9ea7dfc657653368237e08903514cdca1ec" }
serde = { version = "1", features = ["derive"] }
# four_transports::serve_stateful takes a tokio TcpListener (avenue 3)
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

