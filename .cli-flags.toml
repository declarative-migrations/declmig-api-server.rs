# flags-2-env surface for `declmig-api`
[flags.config]
env = "DECLMIG_CONFIG"
long = "config"
help = "Path to TOML configuration"

[flags.api_base]
env = "DECLMIG_API_BASE"
long = "api-base"
help = "API HTTP base URL"

[flags.json]
env = "DECLMIG_JSON"
long = "json"
switch = true
help = "Emit JSON"


[flags.declmig-api-bind]
env = "DECLMIG_API_BIND"
long = "declmig-api-bind"
type = "string"
help = "Runtime environment key DECLMIG_API_BIND."

[flags.declmig-api-tcp-bind]
env = "DECLMIG_API_TCP_BIND"
long = "declmig-api-tcp-bind"
type = "string"
help = "Runtime environment key DECLMIG_API_TCP_BIND."

[flags.declmig-nats-url]
env = "DECLMIG_NATS_URL"
long = "declmig-nats-url"
type = "string"
help = "Runtime environment key DECLMIG_NATS_URL."
