[identity]
service = "declmig-api-server"
type_name = "ServiceConfig"

[parse]
allow_unknown = false

[env]
# Server startup consumes only the inherited process environment. Plaintext
# dotenv discovery is disabled, and NATS stays environment-only because URLs
# may contain credentials or other infrastructure-sensitive material.
load = false
ignore = ["DECLMIG_NATS_URL"]

[flags.config]
env = "DECLMIG_CONFIG"
aliases = ["config"]
type = "string"
help = "Path to TOML configuration."

[flags.api-base]
env = "DECLMIG_API_BASE"
aliases = ["api-base"]
type = "string"
help = "API HTTP base URL."

[flags.json]
env = "DECLMIG_JSON"
aliases = ["json"]
type = "boolean"
default = false
help = "Emit JSON output where supported."

[flags.declmig-api-bind]
env = "DECLMIG_API_BIND"
aliases = ["declmig-api-bind"]
type = "string"
help = "HTTP listener bind address."

[flags.declmig-api-tcp-bind]
env = "DECLMIG_API_TCP_BIND"
aliases = ["declmig-api-tcp-bind"]
type = "string"
help = "TCP transport bind address."
